<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk · R-CEMS KVAS</title>
  <link rel="icon" type="image/png" href="assets/kvas-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo-wrap">
        <img src="assets/kvas-logo.png" alt="Logo KVAS" class="brand-logo" onerror="this.hidden=true; this.nextElementSibling.hidden=false;">
        <div class="brand-fallback" hidden>KV</div>
      </div>
      <div>
        <h1>R-CEMS</h1>
        <p>Kolej Vokasional Alor Setar · Makmal SKR</p>
      </div>
    </div>

    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="auth-tab active">Log Masuk</button>
      <button type="button" id="tabRegister" class="auth-tab">Daftar Akaun</button>
    </div>

    <div id="authError" class="auth-error" hidden></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Emel Pengguna</label>
        <input type="email" id="loginEmail" required placeholder="nama@kvas.edu.my" class="input-field" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="loginPassword">Kata Laluan</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="input-field" autocomplete="current-password">
      </div>
      <button type="submit" class="button auth-submit">Log Masuk</button>
    </form>

    <form id="registerForm" hidden>
      <div class="form-group">
        <label for="regName">Nama Penuh</label>
        <input type="text" id="regName" required placeholder="Nama penuh anda" class="input-field" autocomplete="name">
      </div>
      <div class="form-group">
        <label for="regEmail">Emel</label>
        <input type="email" id="regEmail" required placeholder="nama@kvas.edu.my" class="input-field" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="regPassword">Kata Laluan</label>
        <input type="password" id="regPassword" required minlength="6" placeholder="Minimum 6 aksara" class="input-field" autocomplete="new-password">
      </div>
      <button type="submit" class="button auth-submit">Daftar &amp; Masuk</button>
      <p class="auth-note">Akaun baharu didaftarkan sebagai Penyelia (baca sahaja). Pentadbir boleh mengemaskini peranan anda.</p>
    </form>

    <div class="auth-divider"><span>atau</span></div>

    <button type="button" id="googleLoginBtn" class="button button-outline auth-google">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.68-.22-2.48H12v4.69h6.46a5.52 5.52 0 0 1-2.39 3.62v3.01h3.87c2.26-2.08 3.58-5.15 3.58-8.84z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.94-2.9l-3.87-3.01c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.11A12 12 0 0 0 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.37-2.28V6.61H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.39l4-3.11z"/>
        <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.61l4 3.11C6.22 6.86 8.87 4.75 12 4.75z"/>
      </svg>
      <span>Teruskan dengan Google</span>
    </button>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>

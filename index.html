<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk · Sistem Pengurusan Makmal SKR 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">SK</div>
      <div>
        <h2>Makmal SKR 2</h2>
        <p>Kolej Vokasional Alor Setar</p>
      </div>
    </div>

    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">Log Masuk</button>
      <button type="button" id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">Daftar Akaun</button>
    </div>

    <div id="authError" class="auth-error" style="display: none;"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginEmail">Emel Pengguna</label>
        <input type="email" id="loginEmail" required placeholder="contoh@kvas.edu.my" class="input-field">
      </div>
      <div class="form-group">
        <label for="loginPassword">Kata Laluan</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="input-field">
      </div>
      <button type="submit" class="button auth-submit">Log Masuk</button>

      <div class="demo-box">
        <p class="demo-title">Akaun Demo (Kata laluan: <span class="mono-text">123456</span>)</p>
        <ul>
          <li><strong>Pentadbir:</strong> <span class="mono-text">admin@kvas.edu.my</span></li>
          <li><strong>Juruteknik:</strong> <span class="mono-text">tech@kvas.edu.my</span></li>
          <li><strong>Penyelia:</strong> <span class="mono-text">penyelia@kvas.edu.my</span></li>
        </ul>
      </div>
    </form>

    <!-- SIGN UP FORM -->
    <form id="registerForm" onsubmit="handleSignUp(event)" style="display: none;">
      <div class="form-group">
        <label for="regName">Nama Penuh</label>
        <input type="text" id="regName" required placeholder="Nama anda" class="input-field">
      </div>
      <div class="form-group">
        <label for="regEmail">Emel</label>
        <input type="email" id="regEmail" required placeholder="nama@kvas.edu.my" class="input-field">
      </div>
      <div class="form-group">
        <label for="regPassword">Kata Laluan</label>
        <input type="password" id="regPassword" required placeholder="Minimum 6 aksara" class="input-field">
      </div>
      <div class="form-group">
        <label for="regRole">Peranan Pengguna</label>
        <select id="regRole" class="input-field">
          <option value="Pentadbir">Pentadbir Sistem</option>
          <option value="Juruteknik">Juruteknik Makmal</option>
          <option value="Penyelia">Penyelia Makmal</option>
        </select>
      </div>
      <button type="submit" class="button auth-submit">Daftar & Masuk</button>
    </form>
  </div>

  <script type="module" src="js/auth.js"></script>
  <script>
    function switchAuthTab(mode) {
      const isLogin = mode === 'login';
      document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
      document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabRegister').classList.toggle('active', !isLogin);
      document.getElementById('authError').style.display = 'none';
    }
  </script>
</body>
</html>
